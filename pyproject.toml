[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-analyst-api"
version = "0.1.0"
description = "Voice-Based Data Analysis System with FastAPI and Whisper"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "tenacity>=9.0",

    # Data & SQL
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    "sqlglot>=23.0.0",

    # Audio (Speech-to-Text)
    "faster-whisper>=1.0.0",
    "python-multipart>=0.0.9",
    "av>=11,<19"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
include = ["app*"]